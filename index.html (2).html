<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kofi Ker Café</title>
<style>
:root{--bg:#1b120d;--card:#2b1e16;--line:#3d2c20;--tx:#f3e6d8;--mut:#a99683;--ac:#d4a373;--acx:#1b120d;--bad:#e8856b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6eee5;--card:#fffaf4;--line:#e3d3c1;--tx:#2a1c12;--mut:#7a6552;--ac:#7b4a28;--acx:#fff7ee;--bad:#b3402a;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center}.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;display:block}
.brand b{display:block;font-size:17px}.brand small{color:var(--mut)}
nav{display:flex;gap:6px;flex-wrap:wrap}
.tab,.pill{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer}
.tab.on,.pill.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding:16px;max-width:1100px;margin:0 auto}
.pos{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:800px){.pos{grid-template-columns:1fr}}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer}
.item:hover{border-color:var(--ac)}.item:disabled{opacity:.45;cursor:not-allowed}
.item .ic{font-size:28px;display:block}.item b{display:block;margin-top:6px}.item span{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2,h2{margin:0 0 10px;font-size:16px}
.line{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1}.q{display:flex;align-items:center;gap:6px}
.q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer}
.empty{color:var(--mut);padding:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.tot{font-size:20px;font-weight:700;color:var(--ac)}
input[type=number]{width:110px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right}
.charge{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font-weight:700;font-size:16px;cursor:pointer}
.charge:disabled{opacity:.4;cursor:not-allowed}
.bad{color:var(--bad)}.msg{min-height:20px;margin-top:8px;color:var(--ac);font-size:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.wrap{overflow-x:auto}.stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}.stats .panel{flex:1;min-width:140px}
.small{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer}
</style></head><body>

<script>
var items=[

 {id:10,name:"Blueberry Muffin",cat:"Pastry",price:85,stock:15,ic:"🧁"}];
var cats=["All","Coffee","Non-Coffee","Pastry"],views=["Point of Sale","Menu","Inventory","Sales"];
var view=0,cat="All",order={},cash="",msg="",sales=[];
var $=function(s){return document.querySelector(s)};
var peso=function(n){return "₱"+Number(n).toLocaleString("en-PH")};
var find=function(id){return items.filter(function(i){return i.id==id})[0]};
function total(){var t=0;for(var id in order)t+=find(id).price*order[id];return t}
function add(id,d){var it=find(id),q=(order[id]||0)+d;if(q>it.stock)q=it.stock;if(q<=0)delete order[id];else order[id]=q;msg="";draw()}
function charge(){var t=total(),c=Number(cash);if(!t||c<t)return;var lines=[];
 for(var id in order){var it=find(id);it.stock-=order[id];lines.push(it.name+" ×"+order[id])}
 sales.unshift({time:new Date().toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"}),lines:lines.join(", "),total:t,change:c-t});
 msg="Charged "+peso(t)+". Change: "+peso(c-t);order={};cash="";draw()}
function nav(){$("#nav").innerHTML=views.map(function(v,i){return '<button class="tab'+(i==view?' on':'')+'" data-v="'+i+'">'+v+'</button>'}).join("")}
function pos(){
 var list=items.filter(function(i){return cat=="All"||i.cat==cat});
 var pills=cats.map(function(c){return '<button class="pill'+(c==cat?' on':'')+'" data-c="'+c+'">'+c+'</button>'}).join("");
 var grid=list.map(function(i){return '<button class="item" data-a="'+i.id+'"'+(i.stock?'':' disabled')+'><span class="ic">'+i.ic+'</span><b>'+i.name+'</b><span>'+peso(i.price)+(i.stock<=5?' · '+(i.stock?i.stock+' left':'sold out'):'')+'</span></button>'}).join("");
 var t=total(),c=Number(cash),ch=c-t,ids=Object.keys(order);
 var lines=ids.length?ids.map(function(id){var it=find(id);return '<div class="line"><span class="n">'+it.name+'</span><span class="q"><button data-m="'+id+'" aria-label="Remove one">−</button>'+order[id]+'<button data-a="'+id+'" aria-label="Add one">+</button></span><span>'+peso(it.price*order[id])+'</span></div>'}).join(""):'<div class="empty">No items yet. Tap a drink to add it.</div>';
 return '<div class="pos"><section><div class="pills">'+pills+'</div><div class="grid">'+grid+'</div></section><aside class="panel"><h2>Current order</h2>'+lines+
 '<div class="row"><b>Total</b><span class="tot">'+peso(t)+'</span></div><div class="row"><label for="cash">Cash received</label><input id="cash" type="number" min="0" inputmode="numeric" value="'+cash+'"></div>'+
 '<div class="row"><span>Change</span><b class="'+(t&&ch<0?'bad':'')+'">'+(t&&cash!==""?(ch<0?'Short '+peso(-ch):peso(ch)):'—')+'</b></div>'+
 '<button class="charge" id="go"'+(t&&c>=t?'':' disabled')+'>Charge '+peso(t)+'</button><div class="msg" role="status">'+msg+'</div></aside></div>'}
function menu(){return '<h2>Menu prices</h2><div class="wrap"><table><tr><th>Item</th><th>Category</th><th>Price (₱)</th></tr>'+items.map(function(i){return '<tr><td>'+i.ic+' '+i.name+'</td><td>'+i.cat+'</td><td><input type="number" min="0" value="'+i.price+'" data-p="'+i.id+'"></td></tr>'}).join("")+'</table></div>'}
function inv(){return '<h2>Inventory</h2><div class="wrap"><table><tr><th>Item</th><th>In stock</th><th></th></tr>'+items.map(function(i){return '<tr><td>'+i.name+'</td><td class="'+(i.stock<=5?'bad':'')+'">'+i.stock+'</td><td><button class="small" data-r="'+i.id+'">Restock +10</button></td></tr>'}).join("")+'</table></div>'}
function sl(){var r=sales.reduce(function(a,s){return a+s.total},0);
 return '<div class="stats"><div class="panel"><small>Revenue today</small><div class="tot">'+peso(r)+'</div></div><div class="panel"><small>Orders</small><div class="tot">'+sales.length+'</div></div></div><h2>Orders</h2>'+
 (sales.length?'<div class="wrap"><table><tr><th>Time</th><th>Items</th><th>Total</th></tr>'+sales.map(function(s){return '<tr><td>'+s.time+'</td><td>'+s.lines+'</td><td>'+peso(s.total)+'</td></tr>'}).join("")+'</table></div>':'<div class="empty">No sales yet. Charge an order in Point of Sale.</div>')}
function draw(){nav();$("#app").innerHTML=[pos,menu,inv,sl][view]();var c=$("#cash");if(c&&document.activeElement===document.body&&cash!==""){}}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(d.v!==undefined){view=+d.v;draw()}else if(d.c){cat=d.c;draw()}else if(d.a)add(d.a,1);else if(d.m)add(d.m,-1);
 else if(d.r){find(d.r).stock+=10;draw()}else if(b.id=="go")charge()});
document.addEventListener("input",function(e){var t=e.target;
 if(t.id=="cash"){cash=t.value;var ch=Number(cash)-total(),tot=total();var go=$("#go");go.disabled=!(tot&&Number(cash)>=tot);var bs=document.querySelectorAll(".row b");var el=bs[bs.length-1];el.className=tot&&ch<0?"bad":"";el.textContent=cash===""||!tot?"—":(ch<0?"Short "+peso(-ch):peso(ch))}
 else if(t.dataset.p){var v=Number(t.value);if(v>=0)find(t.dataset.p).price=v}});
draw();
</script></body></html>
